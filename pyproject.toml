[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autobio"
version = "0.0.1"
description = "Unified, agentic-friendly interface to computational biology tools via Docker containers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bryan Briney" },
]
dependencies = [
    "pydantic>=2.0,<3",
    "typer>=0.9,<1",
    "python-on-whales>=0.60,<1",
    "pynvml>=11.5,<12",
    "rich>=13.0,<14",
    "pyyaml>=6.0,<7",
]

[project.scripts]
autobio = "autobio.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
]

[project.urls]
Repository = "https://github.com/briney/autobio"

# --- Tool Configuration ---

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docker: marks tests that require Docker",
    "gpu: marks tests that require GPU access",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "python_on_whales.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pynvml.*"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/autobio"]
